<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="CodeBox — edit HTML, CSS and JS in your browser with live preview. No account, no cookies, projects stay on your device."
    />
    <title>CodeBox — live HTML/CSS/JS editor</title>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading CodeBox">
      <div class="boot-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p>CODEBOX</p>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
    </div>

    <div id="drop-veil" hidden>
      <div class="drop-card">
        <strong>Drop to add</strong>
        <p>HTML, CSS, JS, images — or a <code>.zip</code> of a site</p>
      </div>
    </div>

    <header id="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>CodeBox</h1>
      </div>
      <div class="project-bar">
        <label class="visually-hidden" for="project-select">Active project</label>
        <select id="project-select"></select>
        <button id="btn-project-add" type="button" title="New project">+ Project</button>
        <button id="btn-project-rename" type="button" title="Rename project">Rename</button>
        <button id="btn-project-delete" type="button" title="Delete project">Delete</button>
      </div>
      <nav class="actions" aria-label="Project actions">
        <div class="menu" data-menu>
          <button id="btn-import" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-import">
            Import ▾
          </button>
          <div class="menu-panel" id="menu-import" role="menu" aria-label="Import" hidden>
            <button id="btn-import-files" type="button" role="menuitem">Files…</button>
            <button id="btn-import-zip" type="button" role="menuitem">Site .zip…</button>
          </div>
        </div>
        <div class="menu" data-menu>
          <button id="btn-export" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-export">
            Export ▾
          </button>
          <div class="menu-panel" id="menu-export" role="menu" aria-label="Export" hidden>
            <button id="btn-export-zip" type="button" role="menuitem">Project .zip</button>
            <button id="btn-export-html" type="button" role="menuitem">Single .html file</button>
          </div>
        </div>
        <button id="btn-open-tab" type="button">Open in tab</button>
        <button id="btn-settings" type="button">Settings</button>
        <button id="btn-fullscreen" type="button" class="accent">Fullscreen</button>
      </nav>
    </header>

    <nav id="viewtabs" aria-label="Switch view">
      <button type="button" data-view-btn="files">Files</button>
      <button type="button" data-view-btn="code" aria-current="true">Code</button>
      <button type="button" data-view-btn="preview">Preview</button>
    </nav>

    <main id="layout" data-view="code">
      <aside id="sidebar" aria-label="Project files">
        <div class="pane-head">
          <h2>Files</h2>
          <div class="pane-tools">
            <button id="btn-new-file" type="button" title="New file (use a/b.js for folders)">+ File</button>
            <button id="btn-new-folder" type="button" title="New folder">+ Folder</button>
          </div>
        </div>
        <div id="tree" role="tree" aria-label="Project files"></div>
        <p class="side-note" id="storage-note"></p>
      </aside>

      <section id="edit-pane" aria-label="Code editor">
        <div class="pane-head">
          <h2 id="active-path">—</h2>
          <span id="save-dot" class="save-dot" title="All changes save automatically">saved</span>
        </div>
        <div id="editor"></div>
        <div id="doc-errors" role="alert" hidden></div>
      </section>

      <section id="stage-pane" aria-label="Live preview">
        <div class="pane-head">
          <h2>Preview</h2>
          <span id="entry-label" class="entry-label"></span>
        </div>
        <div id="stage-wrap">
          <iframe
            id="preview"
            title="Live website preview"
            sandbox="allow-scripts"
            allow="fullscreen"
          ></iframe>
        </div>
        <details id="console-box">
          <summary>Console <span id="console-count" class="count"></span></summary>
          <div class="console-row">
            <ol id="console-list"></ol>
            <button id="btn-console-clear" type="button">Clear</button>
          </div>
        </details>
      </section>
    </main>

    <footer id="foot">
      <p>
        No cookies · No account · Projects stay in this browser (localStorage) ·
        <span id="save-state">Saved</span>
      </p>
    </footer>

    <input type="file" id="file-input" multiple hidden />
    <input type="file" id="zip-input" accept=".zip,application/zip" hidden />

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dlg-head">
        <h2 id="settings-title">Settings</h2>
        <button id="btn-settings-close" type="button" title="Close settings">✕</button>
      </div>
      <div class="dlg-body">
        <section aria-label="Accent color">
          <h3>Accent color</h3>
          <div id="accent-grid" role="radiogroup" aria-label="Accent presets"></div>
          <label class="set-row" for="accent-custom">
            Custom
            <input type="color" id="accent-custom" value="#000000" />
            <code id="accent-hex"></code>
          </label>
          <label class="set-row" for="set-gradients">
            <input type="checkbox" id="set-gradients" />
            Gradient accents <em class="beta">beta</em>
          </label>
          <div id="gradient-preview" aria-hidden="true"></div>
          <label class="set-row" for="gradient-to">
            Gradient end
            <input type="color" id="gradient-to" value="#000000" />
            <code id="gradient-hex"></code>
          </label>
          <label class="set-row" for="gradient-angle">
            Angle
            <input type="range" id="gradient-angle" min="0" max="360" step="15" />
            <span class="val" id="gradient-angle-val"></span>
          </label>
        </section>
        <section aria-label="Editor">
          <h3>Editor</h3>
          <label class="set-row" for="set-fontsize">
            Font size
            <input type="range" id="set-fontsize" min="11" max="18" step="1" />
            <span class="val" id="fontsize-val"></span>
          </label>
          <label class="set-row" for="set-tabsize">
            Tab width
            <select id="set-tabsize">
              <option value="2">2 spaces</option>
              <option value="4">4 spaces</option>
            </select>
          </label>
          <label class="set-row" for="set-wrap">
            <input type="checkbox" id="set-wrap" />
            Word wrap
          </label>
          <label class="set-row" for="set-linenumbers">
            <input type="checkbox" id="set-linenumbers" />
            Line numbers
          </label>
        </section>
        <section aria-label="Preview and console">
          <h3>Preview &amp; console</h3>
          <label class="set-row" for="set-autopreview">
            <input type="checkbox" id="set-autopreview" />
            Live preview while typing
          </label>
          <label class="set-row" for="set-consoleopen">
            <input type="checkbox" id="set-consoleopen" />
            Open console on error
          </label>
        </section>
        <section aria-label="Data">
          <h3>Data</h3>
          <p class="set-note" id="settings-usage"></p>
          <div class="set-actions">
            <button id="btn-settings-reset" type="button">Reset settings</button>
            <button id="btn-data-erase" type="button">Erase all local data</button>
          </div>
        </section>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
